<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Multi-Agent Command Center</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #07090e; color: #d1d5db; margin: 0; padding: 25px; min-height: 100vh; }
    
    .top-header { text-align: center; margin-bottom: 25px; }
    .top-header h1 { color: #00f2fe; margin: 0; font-size: 28px; letter-spacing: 1px; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1200px; margin: 0 auto; }
    @media(max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .card { background: #0f172a; padding: 22px; border-radius: 14px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card h3 { margin-top: 0; color: #00f2fe; font-size: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }

    .input-group { margin-bottom: 12px; }
    label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
    input[type="text"], textarea { width: 100%; background: #020617; border: 1px solid #1e293b; color: #f8fafc; border-radius: 6px; padding: 10px; font-size: 13px; outline: none; }
    textarea { height: 70px; resize: none; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    button { color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: transform 0.1s; }
    button:active { transform: scale(0.97); }

    .btn-sec { background: #2563eb; }
    .btn-rem { background: #d97706; }
    .btn-cry { background: #059669; }
    .btn-ecu { background: #dc2626; }
    .btn-cal { background: #7c3aed; }

    /* Crypto Alert Inputs */
    .crypto-alert-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }

    /* TFT Simulator */
    .simulator-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tft-bezel { width: 330px; height: 250px; background: #18181b; border-radius: 16px; padding: 12px; border: 2px solid #27272a; }
    .tft-screen { width: 306px; height: 226px; background: #000; position: relative; overflow: hidden; border-radius: 4px; }
    .tft-topbar { width: 100%; height: 18px; background: #000; color: #22c55e; display: flex; justify-content: space-between; padding: 2px 8px; font-size: 10px; font-family: monospace; }
    .tft-header { width: 100%; height: 34px; background: #001F; color: #fff; display: flex; align-items: center; padding-left: 10px; font-weight: bold; font-family: monospace; font-size: 14px; }
    .tft-border { position: absolute; top: 58px; left: 4px; width: 294px; height: 162px; border: 2px solid #07FF; border-radius: 8px; pointer-events: none; }
    .tft-content { padding: 12px; color: #fff; font-family: monospace; font-size: 13px; word-break: break-word; white-space: pre-line; }
  </style>
</head>
<body>

<div class="top-header">
  <h1>⚡ Autonomous Command Hub</h1>
</div>

<div class="dashboard-grid">
  
  <div style="display: flex; flex-direction: column; gap: 20px;">
    
    <!-- AI Dispatcher -->
    <div class="card">
      <h3>🤖 AI Agent Dispatcher</h3>
      <div class="input-group">
        <label>Prompt / Εντολή</label>
        <textarea id="prompt" placeholder="Γράψε εντολή για Γραμματέα, ECU Diagnostic, Calendar ή Reminder..."></textarea>
      </div>

      <div class="btn-grid">
        <button class="btn-sec" onclick="setAgent('SECRETARY')">Γραμματέας</button>
        <button class="btn-rem" onclick="setAgent('REMINDER')">Υπενθύμιση</button>
        <button class="btn-ecu" onclick="setAgent('ECU_DIAG')">ECU Specialist</button>
        <button class="btn-cal" onclick="setAgent('CALENDAR')">Calendar Sync</button>
      </div>
    </div>

    <!-- Crypto Target Alerts -->
    <div class="card">
      <h3>📈 Crypto Trading & Target Alert Engine</h3>
      <div class="crypto-alert-grid">
        <input type="text" id="coin-id" placeholder="Coin (e.g. bitcoin, aerodrome-finance, ripple)">
        <input type="text" id="tp-price" placeholder="Take Profit ($)">
        <input type="text" id="sl-price" placeholder="Stop Loss ($)">
      </div>
      <button class="btn-cry" style="width: 100%; margin-top: 10px;" onclick="checkCryptoAlert()">Έλεγχος & Αποστολή Alert στην Οθόνη</button>
    </div>

  </div>

  <!-- Hardware Simulator -->
  <div class="card simulator-wrapper">
    <h3>🖥️ ESP32 Hardware Real-Time Screen</h3>
    <div class="tft-bezel">
      <div class="tft-screen">
        <div class="tft-topbar">
          <span>WS: LIVE</span>
          <span id="clock">12:00</span>
        </div>
        <div id="sim-header" class="tft-header">EXECUTIVE HUB</div>
        <div id="sim-border" class="tft-border"></div>
        <div id="sim-message" class="tft-content">Systima etoimo gia leitourgia.</div>
      </div>
    </div>
  </div>

</div>

<script>
  const socket = io();

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().substring(0,5);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function hexToCss(hexStr) {
    if(!hexStr) return '#ffffff';
    let num = parseInt(hexStr, 16);
    let r = (num >> 11) & 0x1F;
    let g = (num >> 5) & 0x3F;
    let b = num & 0x1F;
    return `rgb(${Math.round((r * 255) / 31)},${Math.round((g * 255) / 63)},${Math.round((b * 255) / 31)})`;
  }

  socket.on('display_update', (data) => {
    document.getElementById('sim-header').innerText = data.title || "AGENT";
    document.getElementById('sim-header').style.backgroundColor = hexToCss(data.theme.headerBg);
    document.getElementById('sim-border').style.borderColor = hexToCss(data.theme.accentColor);
    document.getElementById('sim-message').innerText = data.message || "";
    document.getElementById('sim-message').style.color = hexToCss(data.theme.textColor);
  });

  async function setAgent(type) {
    const prompt = document.getElementById('prompt').value;
    await fetch('/api/agent/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, prompt, token: 'DEV_001' })
    });
  }

  async function checkCryptoAlert() {
    const coin = document.getElementById('coin-id').value || 'bitcoin';
    const tp = document.getElementById('tp-price').value;
    const sl = document.getElementById('sl-price').value;

    await fetch('/api/crypto/alert-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ coin, tp, sl })
    });
  }
</script>

</body>
</html>
