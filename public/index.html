<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Hub v6.0 Ultra</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #05070a;
      --card-bg: rgba(15, 20, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --cyan: #00f2fe;
      --purple: #9d4edd;
      --amber: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; display: flex; justify-content: center; }

    .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 20px; }

    /* HEADER */
    header {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(16px); padding: 18px 24px; border-radius: 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.1rem; letter-spacing: 2px; color: var(--cyan); }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); }

    /* TICKERS */
    .tickers { display: flex; gap: 12px; }
    .t-card {
      background: rgba(0,0,0,0.4); border: 1px solid var(--card-border);
      padding: 6px 14px; border-radius: 10px; font-family: monospace; font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
    }

    /* GRID */
    .grid { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    /* CARDS */
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(16px); border-radius: 20px; padding: 24px;
      display: flex; flex-direction: column; gap: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .card-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--cyan); display: flex; align-items: center; gap: 8px; }

    /* PRESETS */
    .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .p-btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
      color: var(--text); padding: 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .p-btn:hover { background: var(--cyan); color: #000; font-weight: 700; }

    /* INPUTS */
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    input, textarea, select {
      background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 12px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 242, 254, 0.2); }

    .btn-send {
      background: var(--cyan); color: #000; font-weight: 800; border: none;
      padding: 14px; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
      transition: all 0.2s;
    }
    .btn-send:hover { box-shadow: 0 0 20px var(--cyan); opacity: 0.9; }

    /* DISPLAY MIRROR */
    .esp-preview {
      background: #000; border: 2px solid var(--cyan); border-radius: 14px;
      padding: 20px; min-height: 180px; position: relative; box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
    }
    .prev-head { font-size: 0.75rem; font-family: monospace; color: var(--cyan); margin-bottom: 8px; }
    .prev-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .prev-body { font-size: 0.95rem; color: #94a3b8; line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand"><div class="status-dot"></div>COMMAND CENTER v6.0</div>
      <div class="tickers">
        <div class="t-card"><span style="color:var(--amber)">BTC</span><span id="btc-val">$0.00</span></div>
        <div class="t-card"><span style="color:var(--cyan)">XRP</span><span id="xrp-val">$0.00</span></div>
        <div class="t-card"><span style="color:var(--purple)">AERO</span><span id="aero-val">$0.00</span></div>
      </div>
    </header>

    <div class="grid">
      <!-- CONTROL PANEL -->
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-sliders"></i> Dispatch Control</div>

        <div class="field">
          <label>Quick Presets</label>
          <div class="presets">
            <button class="p-btn" onclick="setPreset('ECU_DIAG', 'ECU STATUS', 'DTC P0606: Internal Control Module Error.')"><i class="fa-solid fa-microchip"></i> ECU Diag</button>
            <button class="p-btn" onclick="setPreset('TRADE_BOT', 'TAKE PROFIT', 'BTC Target Reached @ $88,500. Executed.')"><i class="fa-solid fa-chart-line"></i> Crypto Trade</button>
            <button class="p-btn" onclick="setPreset('WORKSHOP', 'SERVICE DUE', 'Porsche 911 ECU Remap scheduled @ 16:30.')"><i class="fa-solid fa-wrench"></i> Workshop</button>
            <button class="p-btn" onclick="setPreset('SYSTEM', 'ALL SYSTEMS OK', 'All agents running smoothly.')"><i class="fa-solid fa-check-double"></i> Normal</button>
          </div>
        </div>

        <div class="field"><label>Agent Name</label><input type="text" id="inp-agent" value="ECU_DIAG" /></div>
        <div class="field"><label>Header Title</label><input type="text" id="inp-title" value="ECU STATUS" /></div>
        <div class="field"><label>Message Prompt</label><textarea id="inp-msg" rows="3">DTC P0606: Internal Control Module Error.</textarea></div>
        <button class="btn-send" onclick="sendBroadcast()"><i class="fa-solid fa-paper-plane"></i> Broadcast to ESP32 Display</button>
      </div>

      <!-- ESP MIRROR & CONFIG -->
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-desktop"></i> ESP32 Hardware Mirror</div>

        <div class="esp-preview">
          <div class="prev-head" id="mir-agent">ECU_DIAG</div>
          <div class="prev-title" id="mir-title">ECU STATUS</div>
          <div class="prev-body" id="mir-msg">DTC P0606: Internal Control Module Error.</div>
        </div>

        <div class="field">
          <label>ESP32 Neon Theme Color</label>
          <select id="theme-select" onchange="sendBroadcast()">
            <option value="0x07FF">Electric Cyan</option>
            <option value="0xF800">Crimson Red</option>
            <option value="0x07E0">Neon Green</option>
            <option value="0xFDA0">Amber Gold</option>
            <option value="0xA25F">Cyber Purple</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function setPreset(agent, title, msg) {
      document.getElementById('inp-agent').value = agent;
      document.getElementById('inp-title').value = title;
      document.getElementById('inp-msg').value = msg;
      sendBroadcast();
    }

    function sendBroadcast() {
      const agent = document.getElementById('inp-agent').value;
      const title = document.getElementById('inp-title').value;
      const message = document.getElementById('inp-msg').value;
      const accent = document.getElementById('theme-select').value;

      socket.emit('broadcast_display', {
        agent: agent,
        title: title,
        message: message,
        theme: { accentColor: accent }
      });
    }

    socket.on('display_update', (data) => {
      if(data.agent) document.getElementById('mir-agent').innerText = data.agent;
      if(data.title) document.getElementById('mir-title').innerText = data.title;
      if(data.message) document.getElementById('mir-msg').innerText = data.message;
    });

    async function fetchBybit() {
      try {
        const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
        const data = await res.json();
        if(data.result && data.result.list) {
          const list = data.result.list;
          const btc = list.find(c => c.symbol === 'BTCUSDT');
          const xrp = list.find(c => c.symbol === 'XRPUSDT');
          const aero = list.find(c => c.symbol === 'AEROUSDT');

          if(btc) document.getElementById('btc-val').innerText = '$' + parseFloat(btc.lastPrice).toLocaleString();
          if(xrp) document.getElementById('xrp-val').innerText = '$' + parseFloat(xrp.lastPrice).toFixed(4);
          if(aero) document.getElementById('aero-val').innerText = '$' + parseFloat(aero.lastPrice).toFixed(4);
        }
      } catch(e) {}
    }

    setInterval(fetchBybit, 8000);
    fetchBybit();
  </script>
</body>
</html>
