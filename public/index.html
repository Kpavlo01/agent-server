<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMAND CENTER V12 PRO</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel-bg: #111827;
      --panel-border: #1f293d;
      --accent-cyan: #00f0ff;
      --accent-spotify: #1db954;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 24px; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 18px 24px; border-radius: 14px; border: 1px solid var(--panel-border); }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: 1.5px; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .tab { background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 14px; border-radius: 10px; font-weight: 700; text-align: center; cursor: pointer; transition: 0.2s; }
    .tab.active { background: #1f293d; color: var(--accent-cyan); border-color: var(--accent-cyan); }
    .tab.spotify-tab.active { color: var(--accent-spotify); border-color: var(--accent-spotify); }

    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }

    .title { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .subtitle { color: var(--text-muted); font-size: 1rem; }

    .progress-bg { background: #1f293d; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { background: var(--accent-spotify); height: 100%; width: 0%; transition: width 0.4s ease; }

    .btn-group { display: flex; gap: 10px; }
    .btn { background: #1f293d; border: 1px solid var(--panel-border); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #374151; }
    .btn-sp { background: var(--accent-spotify); color: #000; text-decoration: none; border: none; font-weight: 700; }

    /* CYD Hardware Mirror Frame */
    .cyd-frame { background: #000; border: 3px solid #374151; border-radius: 12px; height: 220px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
    .cyd-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--accent-cyan); border-bottom: 1px solid #1f293d; padding-bottom: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><div class="dot"></div> COMMAND CENTER V12</div>
    <a href="/api/spotify/login" class="btn btn-sp">🎵 Connect Spotify</a>
  </header>

  <div class="nav-tabs">
    <div class="tab active" onclick="setModule('CRYPTO_DESK')">📈 CRYPTO DESK</div>
    <div class="tab" onclick="setModule('ECU_DIAG')">🔌 ECU DIAG</div>
    <div class="tab" onclick="setModule('WORKSHOP')">🛠️ WORKSHOP</div>
    <div class="tab spotify-tab" onclick="setModule('SPOTIFY')">🎵 SPOTIFY</div>
  </div>

  <div class="main-grid">
    <div class="card">
      <div>
        <div style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px;">Active Workspace Status</div>
        <div class="title" id="web-title">SYSTEM OPERATIONAL</div>
        <div class="subtitle" id="web-subtitle" style="margin-top: 6px;">All operational pipelines synchronized.</div>
      </div>

      <div id="spotify-controls-zone">
        <div class="progress-bg"><div class="progress-fill" id="web-progress"></div></div>
        <div class="btn-group" style="margin-top: 14px;">
          <button class="btn" onclick="spControl('prev')">⏮️ Prev</button>
          <button class="btn" onclick="spControl('play')">▶️ Play</button>
          <button class="btn" onclick="spControl('pause')">⏸️ Pause</button>
          <button class="btn" onclick="spControl('next')">⏭️ Next</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">ESP32 CYD Hardware Sync</div>
      <div class="cyd-frame">
        <div class="cyd-header">
          <span id="cyd-agent">COMMAND_HUB</span>
          <span style="color: var(--accent-spotify);">ESP32 LIVE</span>
        </div>
        <div style="font-size: 1.1rem; font-weight: bold; color: #fff;" id="cyd-title">--</div>
        <div style="font-size: 0.85rem; color: #9ca3af;" id="cyd-msg">--</div>
        <div style="font-size: 0.75rem; color: var(--accent-amber);" id="cyd-ticker">BTC: -- | XRP: --</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function setModule(mod) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', 
          (i===0 && mod==='CRYPTO_DESK') || 
          (i===1 && mod==='ECU_DIAG') || 
          (i===2 && mod==='WORKSHOP') || 
          (i===3 && mod==='SPOTIFY')
        );
      });
      socket.emit('broadcast_display', { currentModule: mod });
    }

    function spControl(act) {
      socket.emit('spotify_control', act);
    }

    socket.on('display_update', (data) => {
      document.getElementById('cyd-agent').innerText = data.agent || "COMMAND_HUB";
      if (data.crypto) {
        document.getElementById('cyd-ticker').innerText = `BTC: $${data.crypto.btc || '--'} | XRP: $${data.crypto.xrp || '--'}`;
      }

      if (data.currentModule === "SPOTIFY" && data.spotify) {
        document.getElementById('web-title').innerText = data.spotify.track;
        document.getElementById('web-subtitle').innerText = data.spotify.artist;
        document.getElementById('cyd-title').innerText = "🎵 " + data.spotify.track;
        document.getElementById('cyd-msg').innerText = data.spotify.artist;

        if (data.spotify.durationMs > 0) {
          const pct = (data.spotify.progressMs / data.spotify.durationMs) * 100;
          document.getElementById('web-progress').style.width = pct + "%";
        }
      } else {
        document.getElementById('web-title').innerText = data.title;
        document.getElementById('web-subtitle').innerText = data.message;
        document.getElementById('cyd-title').innerText = data.title;
        document.getElementById('cyd-msg').innerText = data.message;
      }
    });
  </script>
</body>
</html>
