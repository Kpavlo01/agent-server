<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Enterprise Hub</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0c10; color: #c5c6c7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { display: flex; flex-direction: row; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 950px; width: 100%; }
    
    .card { background: #1f2833; padding: 28px; border-radius: 16px; border: 1px solid #45a29e; flex: 1; min-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; font-size: 22px; color: #66fcf1; }
    .input-group { margin-bottom: 15px; }
    label { font-size: 12px; color: #c5c6c7; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    input[type="text"], textarea { width: 100%; background: #0b0c10; border: 1px solid #45a29e; color: #fff; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; }
    textarea { height: 80px; resize: none; }
    
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: transform 0.1s; }
    button:active { transform: scale(0.97); }
    .btn-sec { background: #0066ff; }
    .btn-rem { background: #ff8800; }
    .btn-soc { background: #e91e63; }
    .btn-cry { background: #2e7d32; }
    #status { margin-top: 15px; font-size: 12px; color: #66fcf1; text-align: center; font-weight: 500; }

    /* Simulator */
    .simulator-card { background: #1f2833; padding: 28px; border-radius: 16px; border: 1px solid #45a29e; display: flex; flex-direction: column; align-items: center; }
    .tft-frame { width: 320px; height: 240px; background: #000; border: 10px solid #0b0c10; border-radius: 14px; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); }
    .tft-statusbar { width: 100%; height: 20px; background: #111; color: #888; display: flex; justify-content: space-between; padding: 2px 8px; font-size: 11px; font-family: monospace; }
    .tft-header { width: 100%; height: 32px; background: #001F; color: #fff; display: flex; align-items: center; padding-left: 10px; font-weight: bold; font-family: monospace; font-size: 15px; }
    .tft-border { position: absolute; top: 58px; left: 6px; width: 308px; height: 174px; border: 2px solid #07FF; border-radius: 8px; pointer-events: none; }
    .tft-body { padding: 15px; color: #fff; font-family: monospace; font-size: 14px; word-break: break-word; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>AI Control Center</h2>
    
    <div class="input-group">
      <label>Device Token (Pairing Key)</label>
      <input type="text" id="deviceToken" value="DEV_001">
    </div>

    <div class="input-group">
      <label>Prompt / Command</label>
      <textarea id="prompt" placeholder="Γράψε εντολή ή θέμα..."></textarea>
    </div>

    <div class="grid-btns">
      <button class="btn-sec" onclick="setAgent('SECRETARY')">Γραμματέας</button>
      <button class="btn-rem" onclick="setAgent('REMINDER')">Υπενθυμίσεις</button>
      <button class="btn-soc" onclick="setAgent('SOCIAL')">Social Media</button>
      <button class="btn-cry" onclick="setAgent('CRYPTO')">Market / Crypto</button>
    </div>
    
    <div id="status">Ready</div>
  </div>

  <!-- Live ESP32 Display Simulator -->
  <div class="simulator-card">
    <h2>Live Device Screen</h2>
    <div class="tft-frame">
      <div class="tft-statusbar">
        <span>WiFi: OK</span>
        <span id="sim-clock">12:00</span>
      </div>
      <div id="sim-header" class="tft-header">GRAMMATEAS</div>
      <div id="sim-border" class="tft-border"></div>
      <div id="sim-message" class="tft-body">Etoimo gia ergaxies.</div>
    </div>
  </div>
</div>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('sim-clock').innerText = now.toTimeString().substring(0,5);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function hexToCss(hexStr) {
    if(!hexStr) return '#ffffff';
    let num = parseInt(hexStr, 16);
    let r = (num >> 11) & 0x1F;
    let g = (num >> 5) & 0x3F;
    let b = num & 0x1F;
    return `rgb(${Math.round((r * 255) / 31)},${Math.round((g * 255) / 63)},${Math.round((b * 255) / 31)})`;
  }

  async function updatePreview() {
    const token = document.getElementById('deviceToken').value;
    try {
      const res = await fetch(`/api/display?token=${token}`);
      if (!res.ok) return;
      const data = await res.json();
      
      document.getElementById('sim-header').innerText = data.title || "AGENT";
      document.getElementById('sim-header').style.backgroundColor = hexToCss(data.theme.headerBg);
      document.getElementById('sim-border').style.borderColor = hexToCss(data.theme.accentColor);
      document.getElementById('sim-message').innerText = data.message || "";
      document.getElementById('sim-message').style.color = hexToCss(data.theme.textColor);
    } catch(e) {}
  }

  async function setAgent(type) {
    const prompt = document.getElementById('prompt').value;
    const token = document.getElementById('deviceToken').value;
    document.getElementById('status').innerText = "Επεξεργασία AI...";
    
    try {
      await fetch('/api/agent/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, prompt, token })
      });
      document.getElementById('status').innerText = "Εστάλη στη συσκευή (" + token + ")";
      updatePreview();
    } catch (e) {
      document.getElementById('status').innerText = "Σφάλμα σύνδεσης.";
    }
  }

  setInterval(updatePreview, 2000);
  updatePreview();
</script>

</body>
</html>
