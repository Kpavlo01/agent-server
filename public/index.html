<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Display Command Center</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0c10; color: #c5c6c7; margin: 0; padding: 25px; min-height: 100vh; }
    .header-title { text-align: center; color: #66fcf1; margin-bottom: 25px; font-size: 26px; }
    
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1100px; margin: 0 auto; }
    @media(max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }

    .card { background: #1f2833; padding: 24px; border-radius: 14px; border: 1px solid #45a29e; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    h3 { margin-top: 0; color: #66fcf1; font-size: 18px; border-bottom: 1px solid #45a29e; padding-bottom: 8px; }
    
    .input-group { margin-bottom: 12px; }
    label { font-size: 11px; color: #8892b0; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    input[type="text"], textarea { width: 100%; background: #0b0c10; border: 1px solid #45a29e; color: #fff; border-radius: 6px; padding: 10px; font-size: 13px; outline: none; }
    textarea { height: 70px; resize: none; }

    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    button { color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: transform 0.1s, opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }

    .btn-sec { background: #0066ff; }
    .btn-rem { background: #ff8800; }
    .btn-soc { background: #e91e63; }
    .btn-cry { background: #2e7d32; }
    .btn-action { background: #45a29e; color: #0b0c10; }

    .crypto-bar { display: flex; gap: 8px; margin-top: 10px; }
    .crypto-btn { flex: 1; background: #112240; border: 1px solid #66fcf1; color: #66fcf1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* TFT Simulator */
    .simulator-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tft-frame { width: 320px; height: 240px; background: #000; border: 12px solid #111; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 0 25px rgba(102, 252, 241, 0.25); }
    .tft-statusbar { width: 100%; height: 20px; background: #111; color: #888; display: flex; justify-content: space-between; padding: 2px 8px; font-size: 11px; font-family: monospace; }
    .tft-header { width: 100%; height: 34px; background: #001F; color: #fff; display: flex; align-items: center; padding-left: 10px; font-weight: bold; font-family: monospace; font-size: 15px; }
    .tft-border { position: absolute; top: 60px; left: 6px; width: 308px; height: 172px; border: 2px solid #07FF; border-radius: 8px; pointer-events: none; }
    .tft-body { padding: 15px; color: #fff; font-family: monospace; font-size: 14px; word-break: break-word; }
    #status { margin-top: 12px; font-size: 12px; color: #66fcf1; text-align: center; }
  </style>
</head>
<body>

<div class="header-title">⚡ AI Display Enterprise Hub</div>

<div class="main-grid">
  <!-- Left Column: Controls & Live Crypto -->
  <div style="display: flex; flex-direction: column; gap: 20px;">
    
    <div class="card">
      <h3>🤖 AI Agent Dispatcher</h3>
      <div class="input-group">
        <label>Prompt / Instructions</label>
        <textarea id="prompt" placeholder="Γράψε εντολή (π.χ. Υπενθύμιση για έλεγχο ECU στις 15:00)..."></textarea>
      </div>

      <div class="grid-btns">
        <button class="btn-sec" onclick="setAgent('SECRETARY')">Γραμματέας</button>
        <button class="btn-rem" onclick="setAgent('REMINDER')">Υπενθυμίσεις</button>
        <button class="btn-soc" onclick="setAgent('SOCIAL')">Social Media</button>
        <button class="btn-cry" onclick="setAgent('CRYPTO')">Market Analysis</button>
      </div>
    </div>

    <div class="card">
      <h3>📈 Live Crypto Feed (CoinGecko API)</h3>
      <p style="font-size: 12px; color: #8892b0; margin-top: 0;">Στείλε live τιμές απευθείας στην οθόνη του ESP32:</p>
      <div class="crypto-bar">
        <button class="crypto-btn" onclick="sendLiveCrypto('bitcoin')">BTC</button>
        <button class="crypto-btn" onclick="sendLiveCrypto('ripple')">XRP</button>
        <button class="crypto-btn" onclick="sendLiveCrypto('aerodrome-finance')">AERO</button>
      </div>
    </div>

  </div>

  <!-- Right Column: Live TFT Preview -->
  <div class="card simulator-container">
    <h3>🖥️ ESP32 Screen Real-Time Mirror</h3>
    <div class="tft-frame">
      <div class="tft-statusbar">
        <span>WS: LIVE</span>
        <span id="sim-clock">12:00</span>
      </div>
      <div id="sim-header" class="tft-header">GRAMMATEAS</div>
      <div id="sim-border" class="tft-border"></div>
      <div id="sim-message" class="tft-body">Etoimo gia ergaxies.</div>
    </div>
    <div id="status">Connected (Socket.io)</div>
  </div>
</div>

<script>
  const socket = io();

  function updateClock() {
    const now = new Date();
    document.getElementById('sim-clock').innerText = now.toTimeString().substring(0,5);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function hexToCss(hexStr) {
    if(!hexStr) return '#ffffff';
    let num = parseInt(hexStr, 16);
    let r = (num >> 11) & 0x1F;
    let g = (num >> 5) & 0x3F;
    let b = num & 0x1F;
    return `rgb(${Math.round((r * 255) / 31)},${Math.round((g * 255) / 63)},${Math.round((b * 255) / 31)})`;
  }

  socket.on('display_update', (data) => {
    document.getElementById('sim-header').innerText = data.title || "AGENT";
    document.getElementById('sim-header').style.backgroundColor = hexToCss(data.theme.headerBg);
    document.getElementById('sim-border').style.borderColor = hexToCss(data.theme.accentColor);
    document.getElementById('sim-message').innerText = data.message || "";
    document.getElementById('sim-message').style.color = hexToCss(data.theme.textColor);
    document.getElementById('status').innerText = "Live Sync Active";
  });

  async function setAgent(type) {
    const prompt = document.getElementById('prompt').value;
    document.getElementById('status').innerText = "Επεξεργασία AI...";
    try {
      await fetch('/api/agent/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, prompt, token: 'DEV_001' })
      });
    } catch (e) {
      document.getElementById('status').innerText = "Σφάλμα σύνδεσης.";
    }
  }

  async function sendLiveCrypto(coin) {
    document.getElementById('status').innerText = `Fetching ${coin.toUpperCase()}...`;
    try {
      await fetch(`/api/crypto/live?coin=${coin}`);
    } catch(e) {
      document.getElementById('status').innerText = "Σφάλμα CoinGecko API.";
    }
  }
</script>

</body>
</html>
