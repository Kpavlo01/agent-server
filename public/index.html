<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMAND HUB // ENTERPRISE CONSOLE</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #090a0f;
      --card-bg: #12151e;
      --card-border: #232838;
      --accent: #38bdf8;
      --accent-muted: rgba(56, 189, 248, 0.15);
      --text: #f8fafc;
      --text-muted: #64748b;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; display: flex; justify-content: center; }

    .app-container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; }

    /* HEADER */
    header {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 18px 24px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-weight: 700; font-size: 1rem; letter-spacing: 1px; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

    .ticker-bar { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
    .t-item { background: #0b0d13; border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 6px; display: flex; gap: 8px; }

    /* LAYOUT GRID */
    .grid { display: grid; grid-template-columns: 1.1fr 1.3fr 0.8fr; gap: 20px; }
    @media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } }

    /* CARDS */
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }
    .card-head {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--card-border); padding-bottom: 10px;
    }

    /* PRESETS */
    .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn-p {
      background: #0b0d13; border: 1px solid var(--card-border);
      color: var(--text); padding: 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .btn-p:hover { border-color: var(--accent); background: var(--accent-muted); color: var(--accent); }

    /* FORM ELEMENTS */
    .group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    input, textarea, select {
      background: #0b0d13; border: 1px solid var(--card-border);
      border-radius: 8px; padding: 12px; color: #fff; font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }

    .btn-send {
      background: var(--accent); color: #000; font-weight: 700; border: none;
      padding: 14px; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
      letter-spacing: 1px; transition: 0.2s;
    }
    .btn-send:hover { opacity: 0.9; transform: translateY(-1px); }

    /* HARDWARE MIRROR FRAME */
    .hw-frame {
      background: #000; border: 2px solid var(--card-border); border-radius: 12px; padding: 12px;
    }
    .hw-screen {
      background: #050608; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px;
      display: grid; grid-template-columns: 2fr 1fr; gap: 12px; min-height: 180px;
    }
    .hw-main { border-right: 1px solid var(--card-border); padding-right: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .hw-side { display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
    .hw-box { background: #0b0d13; border: 1px solid var(--card-border); padding: 8px; border-radius: 6px; }

    /* CHART CONTAINER */
    .chart-container { height: 180px; position: relative; width: 100%; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand"><div class="status-dot"></div>COMMAND HUB // EXECUTIVE SUITE</div>
      <div class="ticker-bar">
        <div class="t-item"><span style="color:var(--amber)">BTC</span><span id="btc-val">$0.00</span></div>
        <div class="t-item"><span style="color:var(--accent)">XRP</span><span id="xrp-val">$0.00</span></div>
        <div class="t-item"><span style="color:var(--green)">AERO</span><span id="aero-val">$0.00</span></div>
      </div>
    </header>

    <div class="grid">
      <!-- DISPATCH CONTROLLER -->
      <div class="card">
        <div class="card-head"><span><i class="fa-solid fa-sliders"></i> Dispatch Control</span></div>

        <div class="group">
          <label>Quick Presets</label>
          <div class="preset-grid">
            <button class="btn-p" onclick="setPreset('ECU_DIAG', 'ECU STAGE 2', 'Porsche 911 GT3 Flash Complete. Target Map Ready.')"><i class="fa-solid fa-microchip"></i> ECU Stage 2</button>
            <button class="btn-p" onclick="setPreset('TRADE_BOT', 'TAKE PROFIT', 'BTC Target $88,500 Executed. Profit Locked.')"><i class="fa-solid fa-chart-line"></i> Crypto Trade</button>
            <button class="btn-p" onclick="setPreset('WORKSHOP', 'SERVICE DUE', 'Battery Diagnostics & PCB Repair Complete.')"><i class="fa-solid fa-wrench"></i> Workshop</button>
            <button class="btn-p" onclick="setPreset('SYSTEM', 'SYSTEM OK', 'All agents operating normally.')"><i class="fa-solid fa-shield-halved"></i> System Normal</button>
          </div>
        </div>

        <div class="group"><label>Agent Identifier</label><input type="text" id="inp-agent" value="ECU_DIAG" /></div>
        <div class="group"><label>Header Title</label><input type="text" id="inp-title" value="ECU STAGE 2" /></div>
        <div class="group"><label>Message Payload</label><textarea id="inp-msg" rows="3">Porsche 911 GT3 Flash Complete. Target Map Ready.</textarea></div>
        <button class="btn-send" onclick="sendBroadcast()"><i class="fa-solid fa-paper-plane"></i> Transmit to Display</button>
      </div>

      <!-- CENTER COLUMN: HARDWARE MIRROR + LIVE CHART -->
      <div class="card">
        <div class="card-head"><span><i class="fa-solid fa-desktop"></i> ESP32 Live Mirror</span><span style="color:var(--green); font-size:0.7rem;">LIVE SYNC</span></div>

        <div class="hw-frame">
          <div class="hw-screen">
            <div class="hw-main">
              <div>
                <div style="font-size:0.7rem; color:var(--accent); font-weight:700;" id="mir-agent">ECU_DIAG</div>
                <div style="font-size:0.95rem; font-weight:700; margin:4px 0;" id="mir-title">ECU STAGE 2</div>
                <div style="font-size:0.8rem; color:var(--text-muted);" id="mir-msg">Porsche 911 GT3 Flash Complete. Target Map Ready.</div>
              </div>
              <div style="font-size:0.65rem; color:var(--text-muted); font-family:'JetBrains Mono';">CYD-320x240 // v8.0 PRO</div>
            </div>
            <div class="hw-side">
              <div class="hw-box"><div style="color:var(--amber)">BTC</div><div id="mir-btc">$88,450</div></div>
              <div class="hw-box"><div style="color:var(--accent)">XRP</div><div id="mir-xrp">$2.415</div></div>
              <div class="hw-box"><div style="color:var(--green)">RSSI</div><div>-42 dBm</div></div>
            </div>
          </div>
        </div>

        <div class="card-head" style="border:none; padding:0; margin-top:8px;"><span><i class="fa-solid fa-chart-area"></i> Real-Time Crypto Trend</span></div>
        <div class="chart-container">
          <canvas id="marketChart"></canvas>
        </div>
      </div>

      <!-- SYSTEM METRICS & LOGS -->
      <div class="card">
        <div class="card-head"><span><i class="fa-solid fa-server"></i> System Telemetry</span></div>
        <div class="group"><label>WiFi RSSI</label><input type="text" value="-42 dBm (Excellent)" readonly /></div>
        <div class="group"><label>Free Heap Memory</label><input type="text" value="214,832 Bytes" readonly /></div>
        <div class="group"><label>Display Interface</label><input type="text" value="320x240 TFT (SPI ILI9341)" readonly /></div>
        <div class="group"><label>Active Protocol</label><input type="text" value="WebSocket SSL (Bi-Directional)" readonly /></div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let btcPrice = "88,450";
    let xrpPrice = "2.415";

    // Chart.js Setup
    const ctx = document.getElementById('marketChart').getContext('2d');
    const marketChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'BTC / USD',
          data: [],
          borderColor: '#38bdf8',
          borderWidth: 2,
          tension: 0.3,
          fill: false,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { grid: { color: '#232838' }, ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } } }
        }
      }
    });

    function setPreset(agent, title, msg) {
      document.getElementById('inp-agent').value = agent;
      document.getElementById('inp-title').value = title;
      document.getElementById('inp-msg').value = msg;
      sendBroadcast();
    }

    function sendBroadcast() {
      const agent = document.getElementById('inp-agent').value;
      const title = document.getElementById('inp-title').value;
      const message = document.getElementById('inp-msg').value;

      socket.emit('broadcast_display', {
        currentAgent: agent,
        currentTitle: title,
        currentMessage: message,
        cryptoRates: { btc: btcPrice, xrp: xrpPrice }
      });
    }

    socket.on('display_update', (data) => {
      if(data.currentAgent) document.getElementById('mir-agent').innerText = data.currentAgent;
      if(data.currentTitle) document.getElementById('mir-title').innerText = data.currentTitle;
      if(data.currentMessage) document.getElementById('mir-msg').innerText = data.currentMessage;
    });

    async function fetchBybit() {
      try {
        const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
        const data = await res.json();
        if(data.result && data.result.list) {
          const list = data.result.list;
          const btc = list.find(c => c.symbol === 'BTCUSDT');
          const xrp = list.find(c => c.symbol === 'XRPUSDT');
          const aero = list.find(c => c.symbol === 'AEROUSDT');

          if(btc) {
            const rawVal = parseFloat(btc.lastPrice);
            btcPrice = rawVal.toLocaleString();
            document.getElementById('btc-val').innerText = '$' + btcPrice;
            document.getElementById('mir-btc').innerText = '$' + btcPrice;

            // Update Chart
            const now = new Date().toLocaleTimeString();
            marketChart.data.labels.push(now);
            marketChart.data.datasets[0].data.push(rawVal);
            if(marketChart.data.labels.length > 15) {
              marketChart.data.labels.shift();
              marketChart.data.datasets[0].data.shift();
            }
            marketChart.update();
          }
          if(xrp) {
            xrpPrice = parseFloat(xrp.lastPrice).toFixed(3);
            document.getElementById('xrp-val').innerText = '$' + xrpPrice;
            document.getElementById('mir-xrp').innerText = '$' + xrpPrice;
          }
          if(aero) document.getElementById('aero-val').innerText = '$' + parseFloat(aero.lastPrice).toFixed(4);
        }
      } catch(e) {}
    }

    setInterval(fetchBybit, 5000);
    fetchBybit();
  </script>
</body>
</html>
